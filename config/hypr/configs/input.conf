input {
    # Configuration du clavier
    kb_layout = fr
    kb_variant = 
    kb_model = 
    kb_options = 
    kb_rules = 

    # Paramètres de suivi de la souris et de sensibilité (définis une seule fois)
    follow_mouse = 1
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
    accel_profile=flat
    force_no_accel=1

    # Configuration du pavé tactile
    touchpad {
        natural_scroll = true
    }
}
