# Remove the include below to disconnect Kitty from Omarchy's theming system.
# (Replaces the old matugen colors.conf: colors follow the wiwi theme.)
include ~/.local/state/omarchy/current/theme/kitty.conf

# Settings below override Omarchy's defaults in /etc/xdg/kitty/kitty.conf.
# Ported from dotfiles-hypr (config/kitty/kitty.conf).

font_family      family="JetBrainsMono Nerd Font" style=Bold
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 9.0

background_opacity 0.9
confirm_os_window_close 0
cursor_trail 1
scrollback_lines 2000
wheel_scroll_min_lines 1
enable_audio_bell no
window_padding_width 4
